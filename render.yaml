services:
  - type: web
    name: cross-market-quant-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://llm.nat-d.uk/v1
      - key: LLM_MODEL
        value: gemma-4-E4B-it
      - key: EMBEDDING_MODEL
        value: bge-m3
      - key: MIN_SCORE
        value: "0.30"

